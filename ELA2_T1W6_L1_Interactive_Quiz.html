<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talk, Talk, Talk! — Reading Detective</title><style>
:root{--wine:#792942;--gold:#ffd36b;--ink:#30344d;--pink:#fff0f3}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#ffe4ec,#e6f4ff);color:var(--ink);min-height:100vh}.wrap{max-width:900px;margin:25px auto;padding:18px}.hero{background:var(--wine);border-radius:28px;color:white;text-align:center;padding:20px;box-shadow:0 12px 35px #6e24433d}.hero h1{font-size:clamp(29px,5vw,46px);margin:8px}.hero p{margin:5px}.card{background:white;border:5px solid #fff;border-radius:30px;box-shadow:0 12px 30px #6e244329;margin-top:20px;padding:25px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:800}.bar{height:15px;border-radius:20px;background:#f4dfe5;margin:16px 0;overflow:hidden}.bar>div{height:100%;background:#4db9a4;width:0;transition:.3s}.q{font-size:clamp(22px,3vw,31px);line-height:1.3;margin:20px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:13px}.opt{min-height:72px;text-align:left;border:3px solid #e6d6e0;background:#fff8fa;border-radius:18px;padding:14px 16px;font-size:19px;font-weight:750;cursor:pointer}.opt:hover{background:#fff0cc;border-color:#e9b451}.opt.selected{background:#fff1bc;border-color:#d69c29}.opt.good{background:#d5f8e4;border-color:#40ad70}.opt.bad{background:#ffe1e2;border-color:#e75e72}.opt:disabled{cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{background:var(--wine);color:white;border:0;border-radius:16px;padding:15px 23px;font-size:18px;font-weight:800;cursor:pointer}.btn.secondary{background:#f3e1e8;color:var(--wine)}.btn:disabled{opacity:.4;cursor:not-allowed}.feedback{min-height:58px;font-size:18px;font-weight:700;margin-top:18px}.hide{display:none!important}.end{text-align:center}.end h2{font-size:36px;color:var(--wine)}.small{font-size:14px;opacity:.85}.pill{background:#ffe9ad;border-radius:30px;padding:7px 13px;color:#693a11}@media(max-width:600px){.options{grid-template-columns:1fr}.wrap{margin:0;padding:10px}.card{padding:18px}.opt{min-height:58px}}</style></head><body><main class="wrap"><header class="hero"><div style="font-size:42px">📚 🗣️ 🔎</div><h1>Talk, Talk, Talk!</h1><p>Reading Detective Adventure • WPA Grade 2 • Week 6</p></header><section class="card" id="game"><div class="top"><span id="count">Question 1 of 15</span><span class="pill" id="stars">⭐ 0 stars</span></div><div class="bar"><div id="progress"></div></div><div class="small" id="kind">Choose the best answer.</div><h2 class="q" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="btn secondary" id="speak">🔊 Read aloud</button><button class="btn" id="check" disabled>Check Answer</button><button class="btn hide" id="next">Next ➜</button></div></section><section class="card end hide" id="end"><div style="font-size:70px">🏆</div><h2>Detective Mission Complete!</h2><p id="result" style="font-size:24px"></p><p>Great work reading closely and using story clues!</p><button class="btn" onclick="restart()">Play Again ↻</button></section></main><script>
const QUESTIONS=[{"q": "Who is the main character in Talk, Talk, Talk!?", "type": "MC", "opts": ["Kento", "Sam", "Dad"], "answer": 0, "explain": "Kento tells the story."}, {"q": "Where does Kento go on his first day?", "type": "MC", "opts": ["A new school", "A zoo", "A museum"], "answer": 0, "explain": "The narrator says he is going to a new school."}, {"q": "What does Kento like to do?", "type": "MC", "opts": ["Talk", "Dance", "Paint"], "answer": 0, "explain": "Kento says he loves to talk."}, {"q": "Kento feels shy at his new school at first.", "type": "TF", "opts": ["True", "False"], "answer": 0, "explain": "He does not know anybody."}, {"q": "Who is Sam?", "type": "MC", "opts": ["Kento’s best friend", "Kento’s teacher", "Kento’s brother"], "answer": 0, "explain": "Kento calls Sam his best friend."}, {"q": "What does Kento talk about in the classroom circle?", "type": "MC", "opts": ["His dog and a baseball game", "His new bicycle", "His birthday cake"], "answer": 0, "explain": "He shares summer memories."}, {"q": "Choose TWO people who ask Kento to stop talking earlier in the story.", "type": "MA", "opts": ["His sister", "His mother", "His teacher"], "answer": [0, 1], "explain": "His sister and mother ask for quiet."}, {"q": "Complete: Kento feels ____ at his new school at first.", "type": "FILL", "opts": ["shy", "angry", "sleepy"], "answer": 0, "explain": "The story says “I feel shy.”"}, {"q": "Why does the teacher thank Kento?", "type": "MC", "opts": ["His talking helps classmates feel less shy.", "He wins a baseball game.", "He cleans the classroom."], "answer": 0, "explain": "The teacher says everyone feels less shy."}, {"q": "What sport does Kento watch with his family?", "type": "MC", "opts": ["Baseball", "Soccer", "Tennis"], "answer": 0, "explain": "The story describes a baseball game."}, {"q": "What does Kento talk about with Sam?", "type": "MC", "opts": ["Trucks and dogs", "Only schoolwork", "Cooking dinner"], "answer": 0, "explain": "They discuss trucks, dogs, planes, and baseball."}, {"q": "Who asks Kento what he did last summer?", "type": "MC", "opts": ["His teacher", "His sister", "His dog"], "answer": 0, "explain": "The teacher asks the class about summer."}, {"q": "How does Kento feel when he does not know anybody?", "type": "MC", "opts": ["Shy", "Excited", "Angry"], "answer": 0, "explain": "He says he feels shy."}, {"q": "What happens after Kento starts talking in the circle?", "type": "MC", "opts": ["Other children start talking too.", "Everyone leaves the room.", "The teacher cancels class."], "answer": 0, "explain": "His talking helps classmates join in."}, {"q": "Which is a clue that Kento likes baseball?", "type": "MC", "opts": ["He talks about a home run.", "He buys a kite.", "He rides a bicycle."], "answer": 0, "explain": "He talks about a baseball game and home run."}];let index=0,stars=0,selected=[],locked=false;const $=id=>document.getElementById(id);function render(){const x=QUESTIONS[index];selected=[];locked=false;$('count').textContent=`Question ${index+1} of ${QUESTIONS.length}`;$('stars').textContent=`⭐ ${stars} stars`;$('progress').style.width=(index/QUESTIONS.length*100)+'%';$('question').textContent=x.q;$('kind').textContent=x.type==='MA'?'Choose TWO answers.':x.type==='TF'?'True or False?':'Choose the best answer.';$('options').innerHTML='';x.opts.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=(x.type==='TF'?'':String.fromCharCode(65+j)+'. ')+o;b.onclick=()=>choose(j);$('options').appendChild(b)});$('feedback').textContent='';$('check').disabled=true;$('check').classList.remove('hide');$('next').classList.add('hide')};function choose(j){if(locked)return;const multi=QUESTIONS[index].type==='MA';if(multi){if(selected.includes(j))selected=selected.filter(z=>z!==j);else if(selected.length<2)selected.push(j)}else selected=[j];Array.from($('options').children).forEach((b,k)=>b.classList.toggle('selected',selected.includes(k)));$('check').disabled=multi?selected.length!==2:selected.length!==1};$('check').onclick=()=>{if(locked)return;locked=true;const x=QUESTIONS[index],right=Array.isArray(x.answer)?x.answer:[x.answer];let ok=selected.length===right.length&&selected.every(v=>right.includes(v));if(ok)stars++;Array.from($('options').children).forEach((b,k)=>{b.disabled=true;if(right.includes(k))b.classList.add('good');else if(selected.includes(k))b.classList.add('bad')});$('feedback').textContent=(ok?'🌟 Brilliant! ':'💡 Keep learning! ')+x.explain;$('stars').textContent=`⭐ ${stars} stars`;$('check').classList.add('hide');$('next').classList.remove('hide');$('next').textContent=index===QUESTIONS.length-1?'See Results 🏆':'Next ➜'};$('next').onclick=()=>{index++;if(index===QUESTIONS.length){$('game').classList.add('hide');$('end').classList.remove('hide');$('result').textContent=`You earned ${stars} out of ${QUESTIONS.length} stars!`}else render()};$('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('Read aloud is not supported in this browser.');return}speechSynthesis.cancel();const x=QUESTIONS[index],u=new SpeechSynthesisUtterance(x.q+'. '+x.opts.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join('. '));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};function restart(){index=0;stars=0;$('end').classList.add('hide');$('game').classList.remove('hide');render()}render();</script></body></html>
